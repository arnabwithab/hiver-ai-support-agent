const INTENTS = DATA.intents;
let order = DATA.threads.map((_, i) => i);
for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
const wrap = document.getElementById('cards');
order.forEach((di, n) => {
  const t = DATA.threads[di];
  const el = document.createElement('div');
  el.className = 'card'; el.id = 'card-' + t.thread_id;
  el.innerHTML = `<b>#${n + 1} ${t.thread_id}</b> <small>${t.sheet} / ${t.stratum}</small>`;
  t.turns.forEach(x => {
    const d = document.createElement('div');
    d.className = 'turn ' + (x.who === 'customer' ? 'customer' : 'brand');
    d.innerHTML = `<b>${x.who}:</b> `; d.appendChild(document.createTextNode(x.text));
    el.appendChild(d);
  });

function val(id) { const e = document.getElementById(id); return e ? e.value : ''; }
function radio(name) { const e = document.querySelector(`input[name="${name}"]:checked`); return e ? e.value : ''; }
function esc(s) { return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function download() {
  const rater = val('rater') || 'rX';
  let rows = ['thread_id,stratum,rater_id,intent_label,auto_or_escalate,rationale,draft_pass_fail,draft_critique'];
  let missing = [];
  DATA.threads.forEach(t => {
    const i = val('i-' + t.thread_id), a = radio('a-' + t.thread_id), r = val('r-' + t.thread_id).trim();
    const v = t.draft ? radio('v-' + t.thread_id) : '', c = t.draft ? val('c-' + t.thread_id).trim() : '';
    if (!i || !a || (a === 'escalate' && !r) || (t.draft && (!v || !c))) missing.push(t.thread_id);
    rows.push([t.thread_id, t.stratum, rater, i, a, r, v, c].map(esc).join(','));
  });
  if (missing.length) { alert('Incomplete: ' + missing.length + ' threads e.g. ' + missing.slice(0, 5).join(', ')); return; }
  const blob = new Blob([rows.join('\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'filled_main_' + rater + '.csv'; a.click();
}
