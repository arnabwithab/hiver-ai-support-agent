[project]
name = "hiver-chase-support-agent"
version = "0.1.0"
description = "Hiver-style AI support agent for ChaseSupport Twitter threads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "black>=24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
